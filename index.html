        if (leaveOn(r)) e.appendChild(el("span", "tag", T("leave")));
        e.appendChild(el("span", "en", c ? "✎ " + fxChg(y, c) : fxTxt(y)));
      }
      e.className = "row" + (c ? " chg" : "") + (rowBad(r) ? " bad" : "");
      e.style.display = visible(r) ? "" : "none";
      drawEditor(r);
    }
    function field(box, label, val, normalT, onset) {
      var fld = el("div", "fld"), lb = el("label", null, label), inp = el("input"); inp.type = "time"; inp.step = 60; inp.value = val == null ? "" : fm(val);
      inp.onchange = function () { onset(tmin(inp.value)); };
      fld.appendChild(lb); fld.appendChild(inp);
      if (val == null) { var mb = el("button", "mini", T("normal", { t: fm(normalT) })); mb.type = "button"; mb.onclick = function (ev) { ev.stopPropagation(); onset(normalT); }; fld.appendChild(mb); }
      box.appendChild(fld); return inp;
    }
    function act(box, txt, cls, dis, fn) { var b = el("button", "act" + (cls ? " " + cls : ""), txt); b.type = "button"; b.disabled = !!dis; b.onclick = function (ev) { ev.stopPropagation(); fn(); }; box.appendChild(b); return b; }
    function changed(r) { haptic(); drawRow(r); update(); }
    function drawEditor(r) {
      var d = r.ed; d.textContent = "";
      if (openK !== r.k || !visible(r)) { d.style.display = "none"; return; }
      d.style.display = ""; d.onclick = function (ev) { ev.stopPropagation(); };
      var c = CH[r.k] || {}, S = r.S[di], E = r.E[di], fl = el("div", "fl"), acts = el("div", "acts");
      if (mode === "ed") {
        var x = edCur(r.x[di]);
        d.appendChild(el("div", "cur", T("cur", { v: edTxt(x) }) + (x.ap ? " · " + T("ap1") : "")));
        [["en", "f_en", S], ["ex", "f_ex", E]].forEach(function (z) {
          field(fl, T(z[1]), c.op ? null : (c[z[0]] != null ? c[z[0]] : x[z[0]]), z[2], function (v) {
            var n = CH[r.k] && !CH[r.k].op ? CH[r.k] : {};
            if (v == null || v === x[z[0]]) delete n[z[0]]; else n[z[0]] = v;
            if (n.en == null && n.ex == null) delete CH[r.k]; else { n.op = ""; CH[r.k] = n; }
            changed(r);
          });
        });
        d.appendChild(fl);
        if (c.op) d.appendChild(el("div", "cur", T(c.op === "a" ? "will_abs" : "will_del")));
        act(acts, T("b_abs"), "warn", x.st === "a" || c.op === "a", function () { CH[r.k] = { op: "a" }; changed(r); });
        act(acts, T("b_del"), "", x.st === "n" || c.op === "x", function () { CH[r.k] = { op: "x" }; changed(r); });
      } else {
        var y = fxCur(r.x[di]);
        d.appendChild(el("div", "cur", y.p.length ? T("fx_dev", { p: y.p.map(fm).join(" · ") }) : T("fx_none")));
        fxNeed(y).forEach(function (f) {
          field(fl, T(f === "en" ? "f_en" : "f_ex"), c[f], f === "en" ? S : E, function (v) {
            var n = CH[r.k] || {};
            if (v == null) delete n[f]; else n[f] = v;
            if (n.en == null && n.ex == null) delete CH[r.k]; else CH[r.k] = n;
            changed(r);
          });
        });
        d.appendChild(fl);
      }
      if (CH[r.k]) act(acts, T("b_undo"), "", false, function () { delete CH[r.k]; changed(r); });
      act(acts, T("b_done"), "pri", false, function () { openK = null; changed(r); });
      d.appendChild(acts);
    }
    function filter() { rows.forEach(function (r) { if (r.e) drawRow(r); }); }
    function changedRows() { return rows.filter(function (r) { return CH[r.k]; }); }
    function update() {
      if (mode === "ot") return updateOt();
      var ch = changedRows(), bads = ch.filter(function (r) { return rowBad(r); }), both = bads.filter(function (r) { return rowBad(r) === "both"; });
      err.textContent = both.length ? T("fx_both", { w: names(both, 6) }) : bads.length ? T(mode === "ed" ? "order" : "fx_bad", { w: names(bads, 6) }) : "";
      if (!ch.length) { go.textContent = T("go_" + mode + "0"); go.disabled = true; return; }
      go.textContent = ch.length === 1 ? T("go_" + mode + "1", { w: ch[0].n }) : T("go_" + mode + "N", { n: ch.length });
      go.disabled = bads.length > 0;
    }
    function sendList() {
      var ch = changedRows(); if (!ch.length || go.disabled) return;
      var c = ch.map(function (r) { var z = CH[r.k], a = [r.k, z.en != null ? z.en : -1, z.ex != null ? z.ex : -1]; if (mode === "ed") a.push(z.op || ""); return a; });
      var obj = { v: PV, a: mode, d: days[di], c: c };
      if (JSON.stringify(obj).length > 4000) { err.textContent = T("too_many"); return; }
      go.disabled = true; send(obj); setTimeout(update, 1500);
    }

    /* ---- ⏱: from–to, reason, workers (none ticked) ---- */
    function otDefault() {
      var freq = {}, best = null;
      rows.forEach(function (r) { var v = r.E[di]; freq[v] = (freq[v] || 0) + 1; if (best === null || freq[v] > freq[best]) best = v; });
      otS = best === null ? P.dE : best; otE = (otS + 120) % 1440;
    }
    var otTs = null, otTe = null, otDur = null, otCnt = null;
    function renderOt() {
      if (!touched || otS == null) otDefault();
      var card = el("div", "timecard"), lbl = el("div", "tlbl");
      lbl.appendChild(el("b", null, T("ot_time"))); lbl.appendChild(document.createTextNode(" · " + T("tap"))); card.appendChild(lbl);
      var tw = el("div", "twin"), c1 = el("div", "tcol"), c2 = el("div", "tcol");
      c1.appendChild(el("div", "tlbl", T("ot_from"))); otTs = el("input"); otTs.type = "time"; otTs.step = 60; otTs.id = "ts"; otTs.value = fm(otS); c1.appendChild(otTs);
      c2.appendChild(el("div", "tlbl", T("ot_to"))); otTe = el("input"); otTe.type = "time"; otTe.step = 60; otTe.id = "te"; otTe.value = fm(otE); c2.appendChild(otTe);
      tw.appendChild(c1); tw.appendChild(c2); card.appendChild(tw); otDur = el("div", "dur"); card.appendChild(otDur); app.appendChild(card);
      otTs.onchange = function () { var v = tmin(otTs.value); if (v != null) { otS = v; touched = true; } update(); };
      otTe.onchange = function () { var v = tmin(otTe.value); if (v != null) { otE = v; touched = true; } update(); };
      app.appendChild(el("div", "sec", T("reason")));
      var rw = el("div", "reasons"); rw.id = "reasons"; app.appendChild(rw);
      var wi = el("input"); wi.id = "why"; wi.type = "text"; wi.maxLength = 120; wi.placeholder = T("r_ph"); wi.value = why; wi.oninput = function () { why = wi.value; };
      function drawReasons() {
        rw.textContent = "";
        P.reasons.forEach(function (z, i) { var b = el("button", "rs" + (whyIdx === i ? " sel" : ""), z); b.type = "button"; b.onclick = function () { whyIdx = whyIdx === i ? -1 : i; haptic(); drawReasons(); }; rw.appendChild(b); });
        var ob = el("button", "rs" + (whyIdx === -2 ? " sel" : ""), T("r_other")); ob.type = "button"; ob.id = "r_other";
        ob.onclick = function () { whyIdx = whyIdx === -2 ? -1 : -2; haptic(); drawReasons(); if (whyIdx === -2) { try { wi.focus(); } catch (e) {} } }; rw.appendChild(ob);
        wi.style.display = whyIdx === -2 ? "" : "none";
      }
      app.appendChild(wi); drawReasons();
      err = el("div"); err.id = "err"; app.appendChild(err);
      app.appendChild(el("div", "sec", T("ot_pick")));
      var chips = el("div", "chips"), ca = el("button", "chip", T("all")), cn = el("button", "chip", T("none")); otCnt = el("span", "cnt");
      ca.type = cn.type = "button"; chips.appendChild(ca); chips.appendChild(cn); chips.appendChild(otCnt); app.appendChild(chips);
      searchBox(update);
      var list = el("div"); list.id = "list"; app.appendChild(list);
      rows.forEach(function (r) {
        var e = el("div", "row"); e.setAttribute("data-k", r.k); e.appendChild(el("span", "cb", "✓")); e.appendChild(el("span", "nm", r.n));
        if (leaveOn(r)) e.appendChild(el("span", "tag", T("leave")));
        e.onclick = function () { r.on = !r.on; haptic(); update(); }; r.e = e; list.appendChild(e);
      });
      ca.onclick = function () { rows.forEach(function (r) { if (visible(r)) r.on = true; }); haptic(); update(); };
      cn.onclick = function () { rows.forEach(function (r) { if (visible(r)) r.on = false; }); haptic(); update(); };
      bar(); go.onclick = sendOt; update();
    }
    function updateOt() {
      var sel = rows.filter(function (r) { return r.on; }), dmin = ((otE - otS) % 1440 + 1440) % 1440;
      rows.forEach(function (r) { r.e.className = "row" + (r.on ? " on" : " off"); r.e.style.display = visible(r) ? "" : "none"; });
      otCnt.textContent = T("cnt", { n: sel.length, m: rows.length });
      otDur.textContent = dmin ? T("ot_dur", { h: T("hm", { h: Math.floor(dmin / 60), m: pad(dmin % 60) }) }) + (otE < otS ? " " + T("ot_next") : "") : "";
      err.textContent = otS === otE ? T("ot_same") : "";
      if (!sel.length) { go.textContent = T("pick"); go.disabled = true; return; }
      go.textContent = sel.length === 1 ? T("go_ot1", { w: sel[0].n, a: fm(otS), b: fm(otE) }) : T("go_otN", { n: sel.length, a: fm(otS), b: fm(otE) });
      go.disabled = otS === otE;
    }
    function sendOt() {
      var sel = rows.filter(function (r) { return r.on; }); if (!sel.length || go.disabled) return;
      var w = whyIdx >= 0 ? (P.reasons[whyIdx] || "") : whyIdx === -2 ? why.trim().slice(0, 120) : "";
      go.disabled = true; send({ v: PV, a: "ot", d: days[di], s: otS, e: otE, k: sel.map(function (r) { return r.k; }), w: w }); setTimeout(update, 1500);
    }
    render();
  }

  if (P.mode === "in" || P.mode === "out") renderIO();
  else if (P.date !== today) message(T("stale"), T("chat"), function () { send({ v: PV, a: "stale", m: P.mode }); });
  else renderV2();
  if (!inTelegram()) note(T("notg"));
})();
</script>
